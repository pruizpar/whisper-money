name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:
    inputs:
      build_only:
        description: 'Build Docker image only (skip deploy)'
        type: boolean
        default: true

jobs:
  build-assets:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP & Composer Deps
        uses: ./.github/actions/setup-php-deps

      - name: Setup Bun & Node Deps
        uses: ./.github/actions/setup-bun-deps

      - name: Build Assets
        run: bun run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-assets
          path: public/build
          retention-days: 1

  tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP & Composer Deps
        uses: ./.github/actions/setup-php-deps
        with:
          # pcov, not xdebug: the suite runs with coverage so the `crap` job can
          # report CRAP alongside complexity, and pcov costs far less.
          coverage: pcov

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Generate Passport Keys
        run: php artisan passport:keys --force

      - name: Tests
        # --parallel splits the suite across workers via paratest. Each
        # worker creates its own "testing_test_<N>" database; the mysql
        # service runs as root which has CREATE on *.* so this Just Works
        # without extra grants. Performance suite is excluded because
        # concurrent load skews its timing-based assertions.
        #
        # pcov.directory must be set explicitly: left to autodetect it picks
        # "src", which does not exist here, and every method silently reports
        # zero coverage.
        run: php -d pcov.directory=app ./vendor/bin/pest --exclude-testsuite=Browser,Performance --parallel --processes=4 --coverage-crap4j=build/crap4j.xml
        env:
          TESTCONTAINERS: false
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing
          DB_USERNAME: root
          DB_PASSWORD: password

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: crap4j-report
          path: build/crap4j.xml
          retention-days: 1

  # Reports methods this PR touched that exceed the complexity threshold.
  #
  # Deliberately NOT a required check: it goes red so the number is visible on
  # the PR, but it never blocks the merge. Keep it out of branch protection --
  # moving it into the `linter` job (as the duplication check is) would turn it
  # into a merge gate, which is not what it is for.
  crap:
    # No !cancelled() here on purpose: when `tests` fails there is no coverage
    # artifact to download, and a red `crap` job for a missing file would say
    # nothing about complexity. Skipping is the honest outcome.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Checkout
        # Full history: the check diffs against the merge-base with the base branch.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP & Composer Deps
        uses: ./.github/actions/setup-php-deps

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Download Coverage Report
        uses: actions/download-artifact@v4
        with:
          name: crap4j-report
          path: build

      - name: Complexity Check
        run: php artisan crap --base=origin/${{ github.base_ref }}

  browser-tests:
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    needs: browser-tests-matrix
    steps:
      - name: Aggregate shard results
        run: |
          if [ "${{ needs.browser-tests-matrix.result }}" != "success" ]; then
            echo "One or more browser-tests shards failed: ${{ needs.browser-tests-matrix.result }}"
            exit 1
          fi
          echo "All browser-tests shards passed."

  browser-tests-matrix:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP & Composer Deps
        uses: ./.github/actions/setup-php-deps

      - name: Setup Bun & Node Deps
        uses: ./.github/actions/setup-bun-deps

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Install Playwright system deps
        run: npx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - name: Build Assets
        run: bun run build

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Generate Passport Keys
        run: php artisan passport:keys --force

      - name: Browser Tests
        run: ./vendor/bin/pest --testsuite=Browser --ci --shard=${{ matrix.shard }}/5
        env:
          TESTCONTAINERS: false
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing
          DB_USERNAME: root
          DB_PASSWORD: password

  update-browser-shards:
    if: github.event_name == 'workflow_dispatch' && inputs.build_only == false
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP & Composer Deps
        uses: ./.github/actions/setup-php-deps

      - name: Setup Bun & Node Deps
        uses: ./.github/actions/setup-bun-deps

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Install Playwright system deps
        run: npx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - name: Build Assets
        run: bun run build

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Update Browser Shards
        run: ./vendor/bin/pest --testsuite=Browser --ci --update-shards
        env:
          TESTCONTAINERS: false
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing
          DB_USERNAME: root
          DB_PASSWORD: password

      - name: Upload Browser Shards
        uses: actions/upload-artifact@v4
        with:
          name: browser-shards
          path: tests/.pest/shards.json
          retention-days: 1

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP & Composer Deps
        uses: ./.github/actions/setup-php-deps
        with:
          composer-args: '-q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist'

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=512M --no-progress

  linter:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP & Composer Deps
        uses: ./.github/actions/setup-php-deps
        with:
          composer-args: '-q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist'

      - name: Setup Bun & Node Deps
        uses: ./.github/actions/setup-bun-deps

      - name: Cache Pint results
        uses: actions/cache@v4
        with:
          path: .pint.cache
          key: pint-${{ runner.os }}-${{ hashFiles('composer.lock', 'pint.json') }}
          restore-keys: pint-${{ runner.os }}-

      - name: Run Pint
        run: vendor/bin/pint --test --parallel --cache-file=.pint.cache

      - name: Format Frontend
        run: bun run format

      - name: Lint Frontend
        run: bun run lint

      # Advisory for now: the codebase carries a backlog of pre-existing
      # `tsc --noEmit` errors that predate this step, so it must not gate
      # merges yet. It still surfaces type regressions in the CI log. Flip
      # `continue-on-error` to false once the existing backlog is cleared.
      - name: Type Check Frontend
        run: bun run types
        continue-on-error: true

      - name: Frontend Tests
        run: bun run test

      # Ratchet: fails when copy-paste duplication climbs above the threshold
      # in .jscpd.json. Lower the threshold as clones get extracted; never
      # raise it to make a red build pass.
      - name: Duplication Check
        run: bun run dry

      # Gates merges on a Conventional-Commit PR title. Lives in the linter
      # job (a required check) so a bad title blocks the merge, unlike the old
      # standalone workflow whose check wasn't required. Skipped on push since
      # there's no PR title to validate then.
      - name: Conventional PR title
        if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            style
            refactor
            perf
            test
            build
            ci
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            Subject must not start with uppercase. Use: feat: add checkout, fix(billing): handle retry.

  performance-tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP & Composer Deps
        uses: ./.github/actions/setup-php-deps

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Performance Tests
        run: ./vendor/bin/pest --testsuite=Performance
        env:
          TESTCONTAINERS: false
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing
          DB_USERNAME: root
          DB_PASSWORD: password

  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'app/**'
              - 'bootstrap/**'
              - 'config/**'
              - 'database/**'
              - 'public/**'
              - 'resources/**'
              - 'routes/**'
              - 'storage/**'
              - 'artisan'
              - 'composer.json'
              - 'composer.lock'
              - 'package.json'
              - 'package-lock.json'
              - 'bun.lock'
              - 'bun.lockb'
              - 'vite.config.*'
              - 'tsconfig*.json'
              - 'eslint.config.*'
              - '.prettierrc*'
              - 'phpstan.neon*'
              - 'phpunit.xml*'
              - 'pint.json'
              - 'Dockerfile'
              - 'Dockerfile.*'
              - 'docker/**'
              - '.dockerignore'
              - '.env.example'
              - '.env.production.example'
              - 'docker-compose.production.yml'
              - 'docker-compose.production.local.yml'
              - 'templates/coolify/**'
              - 'scripts/deploy-production.sh'
              - '.github/workflows/ci.yml'

  build-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [tests, linter, static-analysis, performance-tests, changes]
    if: ((github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch') && needs.changes.outputs.code == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract production metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.sha }}

      - name: Build and push production image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.production
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SENTRY_RELEASE=whisper-money@${{ github.sha }}
          provenance: false
          sbom: false

      - name: Keep only the latest two image versions
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          min-versions-to-keep: 2
          token: ${{ github.token }}

  deploy-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: build-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    concurrency:
      group: moneta-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout deployment code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Push image to production
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          CF_TEAM_NAME: ${{ secrets.CF_TEAM_NAME }}
          DEPLOY_SSH_HOST_KEY: ${{ secrets.DEPLOY_SSH_HOST_KEY }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_TARGET: ${{ secrets.DEPLOY_TARGET }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/deploy-production.sh
